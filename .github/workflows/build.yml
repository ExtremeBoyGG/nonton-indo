name: Build

concurrency:
  group: "build"
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - '*.md'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          path: "src"

      - name: Checkout builds branch
        uses: actions/checkout@v4
        with:
          ref: "builds"
          path: "builds"
          token: ${{ secrets.PAT_TOKEN || github.token }}

      - name: Clean old builds
        run: |
          cd $GITHUB_WORKSPACE/builds
          # Simpan repo.json (static metadata, bukan generated)
          cp repo.json /tmp/repo.json 2>/dev/null || true
          # Hapus semua kecuali .git
          find . -maxdepth 1 ! -name '.git' ! -name '.' -exec rm -rf {} +

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Build Plugins
        run: |
          cd $GITHUB_WORKSPACE/src
          chmod +x gradlew
          ./gradlew make makePluginsJson
          cp **/build/*.cs3 $GITHUB_WORKSPACE/builds/
          cp build/plugins.json $GITHUB_WORKSPACE/builds/
          # Restore repo.json
          cp /tmp/repo.json $GITHUB_WORKSPACE/builds/repo.json 2>/dev/null || true

      - name: Push builds
        run: |
          cd $GITHUB_WORKSPACE/builds
          git config --local user.email "${GITHUB_ACTOR_ID}+${GITHUB_ACTOR}@users.noreply.github.com"
          git config --local user.name "${GITHUB_ACTOR}"
          git add -A
          git commit --amend --reset-author -m "Build $GITHUB_SHA" || exit 0
          git push --force

      - name: Purge jsDelivr cache
        if: success()
        run: |
          sleep 2
          curl -s "https://purge.jsdelivr.net/gh/${{ github.repository }}@builds/plugins.json" || true
          curl -s "https://purge.jsdelivr.net/gh/${{ github.repository }}@builds/repo.json" || true
          curl -s "https://purge.jsdelivr.net/gh/${{ github.repository }}@builds/LayarAsia.cs3" || true
          curl -s "https://purge.jsdelivr.net/gh/${{ github.repository }}@builds/PusatFilm.cs3" || true
